services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:latest
    container_name: arcane
    ports:
      - "3552:3552"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane-data:/app/data
      - arcane-builds:/builds
      - /DATA/AppData/arcane-backups:/backups
      - /DATA/AppData/dockge/stacks:/DATA/AppData/dockge/stacks
    environment:
      - APP_URL=http://storage-server.internal:3552
      - PUID=0
      - PGID=0
      - ENCRYPTION_KEY=${KEY}
      - PROJECTS_DIRECTORY=/DATA/AppData/dockge/stacks
    cgroup: host
    healthcheck:
      test: ["CMD", "./arcane", "health", "--timeout", "2s"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  arcane-data:
  arcane-builds:
