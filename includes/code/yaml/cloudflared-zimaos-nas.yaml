services:
  cloudflared:
    container_name: cloudflare-tunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    network_mode: host
    secrets:
      - token
    environment:
      - TUNNEL_TOKEN=$${secrets:token}  # (1)!
      - TUNNEL_METRICS=0.0.0.0:60123
    healthcheck:
      test:
        - CMD
        - cloudflared
        - tunnel
        - ready
      interval: 10s
      timeout: 5s
      retries: 5
secrets:
  token:
    file: ./secrets/token.txt