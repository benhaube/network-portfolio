[project]

dev_addr = "localhost:8000"
docs_dir = "docs"

site_name = "Network Documentation & Portfolio"
site_description = "My personal, self-hosted network documentation, professional portfolio, and blog website. Designed to showcase my knowledge and capabilities in IT and network security, and to make managing my homelab easier."
site_author = "Benjamin Haube"
site_url = "https://portfolio.rac3r4life.online/"

copyright = """
  Copyright &copy; Benjamin Haube –
  <a href="#__consent">Change cookie settings</a>
"""

repo_url = "https://github.com/benhaube/network-portfolio"
repo_name = "benhaube/network-portfolio"
edit_uri = "edit/main/docs/"

watch = [
    "includes"
]

# Zensical supports both implicit navigation and explicitly defined navigation.
# If you decide not to define a navigation here then Zensical will simply
# derive the navigation structure from the directory structure of your
# "docs_dir". The definition below demonstrates how a navigation structure
# can be defined using TOML syntax.
#
# Read more: https://zensical.org/docs/setup/navigation/
# nav = [
#   { "Get started" = "index.md" },
#   { "Markdown in 5min" = "markdown.md" },
# ]

extra_css = ["assets/stylesheets/extra.css"]
extra_javascript = [
    "assets/javascripts/open-in-new-tab.js",
    "assets/javascripts/mermaid.mjs",
    "assets/javascripts/tablesort.js",
    "https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js", 
    "https://unpkg.com/tablesort@5.3.0/dist/sorts/tablesort.date.min.js",
    "https://unpkg.com/tablesort@5.3.0/dist/sorts/tablesort.dotsep.min.js",
    "https://unpkg.com/tablesort@5.3.0/dist/sorts/tablesort.filesize.min.js",
    "https://unpkg.com/tablesort@5.3.0/dist/sorts/tablesort.monthname.min.js",
    "https://unpkg.com/tablesort@5.3.0/dist/sorts/tablesort.number.min.js"
]

[project.extra]
generator = false

# ----------------------------------------------------------------------------
# Section for configuring theme options
# ----------------------------------------------------------------------------

[project.theme]

# change this to "classic" to use the traditional Material for MkDocs look.
#variant = "classic"
custom_dir = "overrides"
favicon = "assets/favicon.svg"
language = "en"

features = [

    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    # "header.autohide",
    # "navigation.expand",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    # "navigation.prune",
    "navigation.sections",
    "navigation.tabs",
    #"navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
    "toc.integrate",
]

logo = "assets/favicon.svg"

[project.theme.icon]
edit = "lucide/file-pen"
view = "lucide/file-code-corner"
next = "lucide/chevron-right"
previous = "lucide/chevron-left"
top = "lucide/chevrons-up"
search = "lucide/search"
share = "lucide/share-2"
annotation = "lucide/circle-chevron-right"

[project.theme.font]
text = "Google Sans"
code = "Google Sans Code"

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"
primary = "green"
accent = "light blue"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary = "green"
accent = "light blue"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon-star"
toggle.name = "Switch to system preference"
primary = "green"
accent = "light blue"

[[project.extra.social]]
icon = "brands/gitlab"
link = "https://gitlab.com/benhaube"
name = "benhaube — Gitlab"

[[project.extra.social]]
icon = "brands/github"
link = "https://github.com/benhaube/network-portfolio"
name = "benhaube — GitHub"

[[project.extra.social]]
icon = "brands/linkedin"
link = "https://www.linkedin.com/in/benjamin-haube/"
name = "Benjamin Haube — Linkedin"

[[project.extra.social]]
icon = "brands/printables"
link = "https://www.printables.com/@rac3r4life"
name = "@rac3r4life — Printables"

[[project.extra.social]]
icon = "brands/reddit"
link = "https://reddit.com/u/benhaube"
name = "u/benhaube — Reddit"

[[project.extra.social]]
icon = "brands/bluesky"
link = "https://bsky.app/profile/rac3r4life.me"
name = "@rac3r4life.me — Bluesky"

[project.extra.consent]
title = "Cookie Consent"
description = """
    We use cookies to recognize your repeated visits and preferences, as well
    as to measure the effectiveness of our documentation and whether users
    find what they're searching for. With your consent, you're helping us to
    make our documentation better.
"""
actions = [
    "accept",
    "reject",
    "manage"
]

