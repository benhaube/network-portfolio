services:
  arcane-edge-agent:
    image: ghcr.io/getarcaneapp/agent:latest
    container_name: arcane-edge-agent
    restart: unless-stopped
    environment:
      - ARCANE_AGENT=true
      - ARCANE_AGENT_TRANSPORT=auto
      - ARCANE_AGENT_TOKEN=${AGENT_TOKEN}
      - ARCANE_MANAGER_API_URL=http://192.168.50.5:3552
      - PUID=0
      - PGID=0
      - ARCANE_PROJECTS_DIRECTORY=/opt/stacks
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane-data:/app/data
      - arcane-backups:/backups
      - arcane-builds:/builds
      - /opt/stacks:/opt/stacks
    labels:
      - com.getarcaneapp.arcane.icon=arcane

volumes:
  arcane-data:
  arcane-backups:
  arcane-builds:
