x-arcane:
  icon: https://github.com/benhaube/network-portfolio/blob/main/readme-assets/logo.png?raw=true
  urls:
    - https://github.com/benhaube/network-portfolio
    - https://portfolio.rac3r4life.online

services:
  portfolio:
    container_name: network-documentation
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80" # (1)!
    volumes:
      - /DATA/AppData/Network-Portfolio/site:/usr/share/nginx/html:ro # (2)!
      - /DATA/AppData/Network-Portfolio/default.conf:/etc/nginx/conf.d/default.conf:ro # (3)!
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s
    labels:
      - com.getarcaneapp.arcane.icon=nginx
