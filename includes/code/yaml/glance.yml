server:
  port: 8580
  assets-path: /app/assets # (1)!

# branding:
  # app-icon-url: /assets/logo.svg
  # hide-footer: true

theme:
  presets:
    default-dark:
      background-color: 216 28 7  # (5)!
      contrast-multiplier: 1.5  # (6)!
      primary-color: 321 100 71
      positive-color: 136 53 51
      negative-color: 4 68 55
    default-light:
      light: true
      background-color: 240 12 95
      contrast-multiplier: 1.5
      primary-color: 321 100 71
      positive-color: 136 53 51
      negative-color: 4 68 55
  custom-css-file: /assets/user.css  # (2)!

auth:
  secret-key: ${secret:auth_secret}  # (3)!
  users:
    admin:
      password: ${secret:admin_pw_hash}  # (4)!
    bhaube:
      password: ${secret:bhaube_pw_hash}
    rpereira:
      password: ${secret:rpereira_pw_hash}

pages:
  - $include: pages/home.yml
  - $include: pages/network.yml
  - $include: pages/formula1.yml