services:
  couchdb:
    container_name: obsidian-livesync
    image: couchdb:3.5.0
    restart: unless-stopped
    ports:
      - mode: ingress
        target: 5984
        published: "5984"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/obsidian-livesync/data/couchdb
        target: /opt/couchdb/data
        bind:
          create_host_path: true
      - type: bind
        source: /DATA/AppData/obsidian-livesync/data/local.ini
        target: /opt/couchdb/etc/local.ini
        bind:
          create_host_path: true
    environment:
      - COUCHDB_PASSWORD=password # (1)!
      - COUCHDB_USER=bhaube