x-arcane:
  icon: docker
  urls:
    - https://github.com/Tecnativa/docker-socket-proxy

services:
  docker-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy
    restart: unless-stopped
    ports:
      - 2375:2375
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - INFO=1
      - POST=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - EXEC=0
      - IMAGES=0
      - NETWORKS=0
      - NODES=0
      - PLUGINS=0
      - SECRETS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - VOLUMES=0
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:2375/info > /dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
