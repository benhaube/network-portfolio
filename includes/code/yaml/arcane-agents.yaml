services:
  arcane-edge-agent:
    image: ghcr.io/getarcaneapp/agent:latest
    container_name: arcane-edge-agent
    restart: unless-stopped
    environment:
      - EDGE_AGENT=true
      - EDGE_TRANSPORT=auto
      - AGENT_TOKEN=${TOKEN}
      - MANAGER_API_URL=http://192.168.50.4:3552
      - PUID=0
      - PGID=0
      - PROJECTS_DIRECTORY=/opt/stacks
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane-data:/app/data
      - arcane-backups:/backups
      - arcane-builds:/builds
      - /opt/stacks:/opt/stacks

volumes:
  arcane-data:
  arcane-backups:
  arcane-builds:
