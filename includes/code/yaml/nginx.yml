services:
  portfolio:
    image: nginx:alpine
    container_name: network-documentation
    restart: unless-stopped
    ports:
      - "8080:80"  # (1)!
    volumes:
      - /DATA/AppData/Network-Portfolio/site:/usr/share/nginx/html:ro  # (2)!
      - /DATA/AppData/Network-Portfolio/default.conf:/etc/nginx/conf.d/default.conf:ro  # (3)!
