# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

# ~~~ Site Settings ~~~

site_author: Benjamin Haube
site_name: Network Documentation & Portfolio
site_url: https://portfolio.rac3r4life.online
site_description:  My personal, self-hosted network documentation, professional portfolio, and blog website. Designed to showcase my knowledge and capabilities in IT and network security, and to make managing my homelab easier.

# Disable directory URLs
use_directory_urls: false

# Watch directories outside of '/docs'
watch:
  # 'network-documentation/includes' contains 'abbreviations.md'
  - includes

# Git Repo URL & Docs directory
repo_url: https://github.com/benhaube/network-portfolio
repo_name: benhaube/network-portfolio
edit_uri: edit/main/docs/

# Set the copyright message & create cookies settings link
copyright: >
  Copyright&copy; 2026 Benjamin Haube -
  <a href="#__consent">Change cookie settings</a>

# Define extra CSS / Javascript directories
extra_css:
  # Other CSS files are imported into the main 'extra.css' file.
  - assets/stylesheets/extra.css
extra_javascript:
  # Pull in Mermaid & elk
  - assets/javascripts/mermaid.mjs
  # Pull in tablesort
  - assets/javascripts/tablesort.js
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - https://unpkg.com/tablesort@5.3.0/dist/sorts/tablesort.date.min.js
  - https://unpkg.com/tablesort@5.3.0/dist/sorts/tablesort.dotsep.min.js
  - https://unpkg.com/tablesort@5.3.0/dist/sorts/tablesort.filesize.min.js
  - https://unpkg.com/tablesort@5.3.0/dist/sorts/tablesort.monthname.min.js
  - https://unpkg.com/tablesort@5.3.0/dist/sorts/tablesort.number.min.js

# ~~~ Theme Settings ~~~

theme:
  name: material
  language: en
  custom_dir: overrides
  favicon: /assets/favicon.svg
  logo: /assets/favicon.svg
  
  # Theme toggles (auto/light/dark)
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: symbols/sun-moon
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: light blue
      toggle:
        icon: symbols/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light blue
      toggle:
        icon: symbols/moon
        name: Switch to system preference
  
  # Set the fonts used on the site.
  font:
    text: Google Sans
    code: Google Sans Code
  
  # Enable Material for MkDocs theme features.
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.footer
    - toc.follow
    - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tooltips
  
  # Change the icons used in the theme.
  icon:
    menu: symbols/menu
    repo: symbols/git
    top: symbols/chevrons-up
    previous: symbols/chevron-left
    next: symbols/chevron-right
    close: symbols/x
    search: symbols/search
    share: symbols/share-2
    annotation: symbols/circle-chevron-right
    edit: symbols/file-pen
    view: symbols/file-code-corner
    alternate: symbols/languages

    # Change icons for built-in admonitions. (Custom admonitions are defined in '/assets/stylesheets/admonition.css')
    admonition:
      note: symbols/paperclip
      abstract: symbols/notebook-text
      info: symbols/info
      tip: symbols/flame
      success: symbols/check
      question: symbols/circle-question-mark
      warning: symbols/triangle-alert
      failure: symbols/octagon-alert
      danger: symbols/zap
      bug: symbols/bug
      example: symbols/flask-conical
      quote: symbols/message-square-quote

    # Set the icons used for page tags.
    tag:
      default: symbols/tag
      3D-printer: symbols/printer-3d-nozzle
      active: symbols/circle-check
      android: brands/android
      backup: symbols/cloud-upload
      container: symbols/container
      container-host: symbols/container
      dashboard: symbols/layout-dashboard
      deprecated: symbols/trash-2
      desktop: symbols/pc-case
      development: symbols/git-branch
      dns: symbols/cloud-cog
      download: symbols/download
      file-share: symbols/share
      hardware: symbols/circuit-board
      inactive: symbols/circle-x
      infra: symbols/chevrons-left-right-ellipsis
      inventory: symbols/clipboard-list
      iot: symbols/home-automation
      isp: symbols/globe
      laptop: symbols/laptop-minimal
      linux: symbols/tux
      living-room: symbols/sofa
      map: symbols/sitemap
      mobile: symbols/tablet-smartphone
      monitor: symbols/activity
      nas: symbols/server-nas
      native: symbols/tux
      network: symbols/lan 
      new: symbols/badge-alert
      office: symbols/desk-lamp
      pc: symbols/personal-computer
      policy: symbols/file-pen-line
      print: symbols/printer
      printer-cart: symbols/printer
      remote: symbols/globe-arrow
      router: symbols/router
      security: symbols/brick-wall-shield
      server: symbols/server
      server-rack: symbols/server-rack
      service: symbols/monitor-cloud
      shell: symbols/terminal
      software: symbols/package
      switch: symbols/ethernet-port
      sync: symbols/refresh-cw
      tools: symbols/wrench
      tv-stand: symbols/tv-minimal
      vh: symbols/host
      video: symbols/film
      vlan: symbols/hub
      vm: symbols/layers
      vpn: symbols/waypoints
      windows: brands/microsoft
      web-host: symbols/globe

# ~~~ Python Markdown Extensions ~~~

markdown_extensions:
  - attr_list
  - abbr
  - admonition
  - tables
  - def_list
  - footnotes
  - material.extensions.preview:
      configurations:
        - sources:
            include: 
              - 01_infrastructure/*
            exclude: 
              - 01_infrastructure/network_security_policy.md
              - 01_infrastructure/disaster_recovery_plan.md
          targets:
            include:
              - 02_hardware/*
  - toc:
      permalink: true
      permalink_title: Permanent link
  - pymdownx.keys
  - pymdownx.details
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path:
        - .
        - includes
        - includes/code
        - includes/code/bash
        - includes/code/config
        - includes/code/gcode
        - includes/code/mermaid
        - includes/code/systemd
        - includes/code/yaml
      auto_append:
        - includes/abbreviations.md
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.blocks.caption
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.highlight:
      use_pygments: true
      auto_title: false
      linenums: true
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
          
# ~~~ Material for MkDocs Built-in Plugins ~~~

plugins:
  - meta:
      enabled: true
  - search
  - open-in-new-tab:
      add_icon: false
  - awesome-nav
  - panzoom:
      full_screen: true
      always_show_hint: false 
  - tags:
      export: true
      tags_sort_by: !!python/name:material.plugins.tags.tag_name_casefold
      tags_slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - optimize:
      optimize_exclude:
        - blog/*
  - social:
      log: true
      log_level: warn
      cards_layout_options:
        font_family: Google Sans
  - blog:
      authors: true
      authors_file: "{blog}/.authors.yml"
      authors_profiles: true
      categories_slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
      post_slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
      post_excerpt_separator: <!-- more -->
      post_readtime_words_per_minute: 265 
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      auto_themed: true
      auto_caption: false
      caption_position: bottom
      background: none
      shadow: true
      manual: true
  
# ~~~ Extra Settings ~~~

extra:

