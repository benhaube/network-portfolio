x-arcane:
  icon-dark: https://haube-pereira.com/icons/netalertx-light.svg
  icon-light: https://haube-pereira.com/icons/netalertx-dark.svg
  urls:
    - https://netalertx.com/
    - https://github.com/netalertx/NetAlertX

services:
  netalertx:
    container_name: netalertx
    image: jokobsk/netalertx:latest
    restart: unless-stopped
    privileged: false
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    cap_drop:
      - ALL
    volumes:
      - /DATA/AppData/netalertx/config:/data/config
      - /DATA/AppData/netalertx/db:/data/db
    tmpfs:
      - /tmp
    environment:
      - ALWAYS_FRESH_INSTALL=false
      - PGID=1000
      - PUID=1000
      - PORT=20211
      - TZ=UTC
