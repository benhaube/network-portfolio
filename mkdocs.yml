# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

# ~~~ Site Settings ~~~

site_author: Benjamin Haube
site_name: Network Documentation & Portfolio
site_url: https://portfolio.rac3r4life.online
site_description:  My personal, self-hosted network documentation, professional portfolio, and blog website. Designed to showcase my knowledge and capabilities in IT and network security, and to make managing my homelab easier.

# ~~~ Theme Settings ~~~

theme:
  name: material
  custom_dir: overrides
  favicon: /assets/favicon.svg
  logo: /assets/favicon.svg
  # Theme toggles (auto/light/dark)
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: symbols/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: light blue
      toggle:
        icon: symbols/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light blue
      toggle:
        icon: symbols/brightness-4
        name: Switch to system preference
  font:
    text: Google Sans
    code: Google Sans Code
  
  # ~~~ Icon Settings ~~~
  
  icon:
    repo: symbols/git
    admonition:
      note: symbols/attach-file
      abstract: symbols/notebook-text
      info: symbols/info
      tip: symbols/flame-outline
      success: symbols/check
      question: symbols/help
      warning: symbols/warning-outline
      failure: symbols/error-alt
      danger: symbols/electric-bolt-outline
      bug: symbols/bug-report-outline
      example: symbols/labs
      quote: symbols/quote
    tag:
      default: symbols/tag-outline
      3D-printer: material/printer-3d
      isp: symbols/web
      iot: symbols/home-automation
      active: symbols/check-circle-outline
      android: brands/android-robot
      backup: symbols/backup
      dashboard: symbols/space-dashboard
      deprecated: symbols/delete-outline
      desktop: symbols/desktop-pc-outline
      development: symbols/graph-8
      dns: symbols/dns
      docker: material/docker
      docker_host: material/docker
      domain: symbols/domain
      download: symbols/download
      file-share: symbols/smb-share
      hardware: symbols/devices
      inactive: symbols/close-circle-outline
      infra: symbols/network-node
      inventory: symbols/inventory
      laptop: symbols/laptop
      linux: material/linux
      living-room: symbols/sofa-outline-alt
      map: symbols/graph-2
      mini-rack: symbols/10-inch-rack
      mobile: symbols/devices-mobile
      monitor: symbols/monitor-heart-outline
      nas: symbols/nas
      native: material/linux
      network: symbols/lan 
      new: symbols/release-alert-outline
      office: symbols/desk
      pc: symbols/personal-computer
      podman: simple/podman
      podman_host: simple/podman
      policy: symbols/policy
      print: symbols/print
      printer-cart: symbols/print
      remote: symbols/web-export
      router: symbols/router-outline
      security: symbols/security
      server: symbols/server-outline
      service: symbols/web
      shell: symbols/terminal
      software: symbols/iframe
      switch: symbols/ethernet-port-outline
      tools: symbols/construction
      tv-stand: symbols/tv
      video: symbols/movie-outline
      vh: symbols/host-outline
      vlan: symbols/lan-outline
      vm: symbols/stacks
      vpn: symbols/vpn-outline
      windows: material/microsoft
    top: symbols/arrow-double-up
    previous: symbols/arrow-left
    next: symbols/arrow-right
    search: symbols/search
    share: symbols/share
    annotation: symbols/expand-circle
    edit: symbols/square-pen
    view: symbols/scan-eye
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.footer
    - toc.follow
    - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tooltips

# ~~~ Python Markdown Extensions ~~~

markdown_extensions:
  - attr_list
  - abbr
  - admonition
  - tables
  - def_list
  - footnotes
  - toc:
      permalink: true
      permalink_title: Permanent link
  - pymdownx.keys
  - pymdownx.details
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path:
        - .
        - docs/includes
        - docs/assets/code
        - docs/assets/code/bash
        - docs/assets/code/config
        - docs/assets/code/gcode
        - docs/assets/code/mermaid
        - docs/assets/code/systemd
        - docs/assets/code/yaml
      auto_append:
        - includes/abbreviations.md
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.blocks.caption
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.highlight:
      use_pygments: true
      auto_title: false
      linenums: true
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
          
# ~~~ MkDocs Native Plugins ~~~

plugins:
  - meta:
      enabled: true
  - search
  - open-in-new-tab:
      add_icon: false
  - awesome-nav
  - roamlinks
  - callouts
  - panzoom:
      full_screen: true
      always_show_hint: true 
  - tags:
      export: true
      tags_sort_by: !!python/name:material.plugins.tags.tag_name_casefold
      tags_slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - optimize:
      optimize_exclude:
        - blog/*
  - social:
      log: true
      log_level: warn
      cards_layout_options:
        font_family: Google Sans Flex
  - blog:
      authors: true
      authors_file: "{blog}/.authors.yml"
      authors_profiles: true
      categories_slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
      post_slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
      post_excerpt_separator: <!-- more -->
      post_readtime_words_per_minute: 265 
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      auto_themed: true
      auto_caption: false
      caption_position: bottom
      background: none
      shadow: true
      manual: true

# ~~~ Watch directories outside of /docs ~~~

watch:
  - includes
exclude_docs: |
  includes/
  
# ~~~ Disable directory URLs ~~~

use_directory_urls: false

