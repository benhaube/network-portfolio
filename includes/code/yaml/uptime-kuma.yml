services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy
    restart: unless-stopped
    ports:
      - 2375:2375
    networks:
      - kuma_network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - INFO=1
      - POST=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DELETE=0
      - DISTRIBUTION=0
      - EXEC=0
      - IMAGES=0
      - NETWORKS=0
      - NODES=0
      - PLUGINS=0
      - SECRETS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - VOLUMES=0
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    cap_add:
      - NET_RAW
    volumes:
      - kuma-data:/app/data
    environment:
      - DOCKER_HOST=tcp://docker-proxy:2375
      - PUID=1000
      - PGID=110
      - TZ=America/New_York
    ports:
      - 3001:3001
    networks:
      - kuma_network
    dns:
      - 192.168.50.6
      - 192.168.50.2
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3001
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  kuma_network:
    driver: bridge
volumes:
  kuma-data:
    external: true
