x-arcane:
  icon: https://haube-pereira.com/icons/f1-replay-timing-small.png
  urls:
    - https://github.com/adn8naiagent/F1ReplayTiming

services:
  f1timing:
    image: ghcr.io/adn8naiagent/f1replaytiming:latest
    ports:
      - "${PORT}:8000"
    volumes:
      - f1data:/data
      - f1cache:/data/fastf1-cache
    env_file: .env

volumes:
  f1data:
  f1cache:
